[paths]
# Copy this file to config.ini or set ORDERBOOK_CONFIG to another file.
# TardisSource contains binance_<market>_<symbol>/incremental_book_L2.
tardis_root = ./data/TardisSource
# Checkpoints are stored below this directory.
checkpoint_root = ./checkpoints

[defaults]
market = usd
ts_divisor = 1000000
crossover_log_threshold = 10
cache_size = 5
io_workers = 3
workers = 20
